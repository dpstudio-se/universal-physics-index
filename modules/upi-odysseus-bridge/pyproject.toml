[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-odysseus-bridge"
version = "0.1.0"
description = "Odysseus AI Protocol Bridge for LLM/AGI/ASI agent communication and control of the Universal Physics Index"
readme = "README.md"
authors = [{ name = "dpstudio-se" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "universal-physics-index",
]

[tool.setuptools.packages.find]
where = ["src"]
