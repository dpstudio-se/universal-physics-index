[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-puter-ui"
version = "0.1.0"
description = "Puter OS and Web UI module for the Universal Physics Index and OdinOS kernel"
readme = "README.md"
authors = [{ name = "dpstudio-se" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "universal-physics-index",
]

[project.scripts]
upi-puter-ui = "upi_puter_ui.server:main"

[tool.setuptools.packages.find]
where = ["src"]
